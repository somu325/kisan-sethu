version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: kisansetu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kisansetu
      POSTGRES_PASSWORD: kisansetu_password
      POSTGRES_DB: kisansetu
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kisansetu -d kisansetu"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
